<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 95vh;
            background-color: rgb(114, 216, 12);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: white;
            padding: 50px;
            width: 420px;
        }

        input {
            background-color: rgb(229, 218, 218);
            border: none;
            padding: 15px;
            font-size: 14px;
            width: 100%;
            height: 40px;
        }

        button {
            background-color: rgb(2, 174, 2);
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            height: 40px;
        }
    </style>
</head>

<body>

    <form onsubmit="return validateForm()">
        <div class="login-card">

            <input type="text" id="username" placeholder="Username" required>

            <br><br>

            <input type="password" id="password" placeholder="Password" required>

            <br>

            <p style="text-align: left;">
                <a href="https://jagadish9810.github.io/jarr/forgetpassword.html" style="text-decoration: none; color: darkgreen;" target="_blank">
                    Forget Password?
                </a>
            </p>

            <button type="submit">LOGIN</button>

            <p style="text-align: center; margin-top: 20px;">
                Not registered?
                <a href="https://jagadish9810.github.io/jarr/registration.html" style="text-decoration: none; color: darkgreen;" target="_blank">
                    Create an account
                </a>
            </p>

        </div>
    </form>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (password === "admin") {
                alert("Login successful!");
                window.location.href = "Homepage.html";
                return false;
            } else {
                alert("Invalid username or password. Please try again.");
                return false;
            }
        }
    </script>

</body>

</html>
